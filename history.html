<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OxyBit | History</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;440;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>OxyBit Monitor</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="waveform.html">Waveform</a></li>
                    <li><a href="history.html">History</a></li>
                    <li><a href="references.html">References</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card" style="position: relative;">
                <h2>History Viewer</h2>
                <p>Select a year to view the monthly log summaries.</p>

                <div id="year-list" class="month-selector-grid">
                    <p style="text-align: center; color: var(--color-text);">Loading...</p>
                </div>

                <h3 id="month-selection-title" style="margin-top: 2rem; border-top: 1px solid var(--color-border); padding-top: 1rem;">
                    Select a Month
                </h3>
                <div id="month-list" class="month-selector-grid">
                    <p style="text-align: center; color: var(--color-text);">Please select a year above.</p>
                </div>
                
                <!-- Bubble monster image - positioned at bottom left of card -->
                <img src="images/bubble-monster.png" alt="Monster blowing bubbles" class="bubble-monster">
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 OxyBit HealthSense. Data secured by Firebase.</p>
        </div>
    </footer>

    <script src="js/firebase-config.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
